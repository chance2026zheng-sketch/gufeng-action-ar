  #start-overlay { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: linear-gradient(160deg,#2a1b1d,#1a1214); color: #f7e7c8; text-align: center; padding: 24px; box-sizing: border-box; }
  #start-overlay h1 { font-size: 22px; margin: 0; font-weight: 700; }

<body>

<div id="story-title"><small>楚韵新生 · AR 奇遇</small><h1>凤鸟衔来的千年</h1></div><section id="story-controls" hidden><nav id="scene-tabs" aria-label="切换场景"></nav><div class="size-row"><label for="character-size">人物大小</label><input id="character-size" type="range" min="50" max="150" value="100"><output id="size-value">100%</output><button id="size-reset">复原</button></div></section><div id="tip" class="hide"></div>

<script src="assets/transparent-video.js?v=matte3"></script>
<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var key = params.get('action');
  // mode: ar=扫图追踪, gyro=摄像头实景自由展示, view=纯展示（无需摄像头，微信可用）
  var rawMode = params.get('mode');
  var mode = (rawMode === 'gyro' || rawMode === 'view') ? rawMode : 'ar';
  var action = window.getAction(key);
  var ENV = window.AR_ENV || { isWeChat: false, isSecure: true, hasMediaDevices: true };

  var $ = function (id) { return document.getElementById(id); };
  var tipTimer = null;

  function tip(text, ms) {
    var el = $('tip');
    el.textContent = text;
    el.classList.remove('hide');
    if (tipTimer) clearTimeout(tipTimer);
    if (ms) tipTimer = setTimeout(function () { el.classList.add('hide'); }, ms);
  }

  if (!action) {
    $('ov-title').textContent = '动作参数缺失';
    $('ov-desc').textContent = '请从首页选择一个动作进入。';
    $('ov-start').style.display = 'none';
    return;
  }

  document.title = action.name + ' · 凤鸟衔来的千年';
  $('ov-title').textContent = '凤鸟衔来的千年 · ' + action.name;
  $('ov-desc').hidden = true;
  $('btn-back').addEventListener('click', function () { location.href = 'index.html'; });

  window.AR_ORDER.forEach(function(k){var a=window.getAction(k),b=document.createElement('a');b.textContent=a.name;b.href='ar.html?action='+encodeURIComponent(k)+'&mode='+mode;b.className=k===key?'selected':'';if(k===key)b.setAttribute('aria-current','true');$('scene-tabs').appendChild(b);});
  function resizeCharacter(){var n=Number($('character-size').value)/100;$('size-value').textContent=Math.round(n*100)+'%';$('float-wrap').style.width=(62*n)+'vmin';var plane=document.querySelector('a-video');if(!plane)return;if(plane.components['stand-figure']){plane.setAttribute('stand-figure','scale',n);}else{plane.setAttribute('scale',n+' '+n+' '+n);}}
  $('character-size').addEventListener('input',resizeCharacter);
  $('size-reset').onclick=function(){$('character-size').value=100;resizeCharacter();};
  function showHud() {
    $('start-overlay').classList.add('hide');
    $('hud').style.display = 'flex';
    $('story-controls').hidden=false;
    var badge = $('name-badge');
    badge.textContent = action.name + ' · ' + (mode === 'ar' ? '扫图追踪' : '自由展示');
    badge.style.display = 'block';
  }

  /* ============ 站立组件：人物垂直立在纸面上，正面朝向镜头 ============
   * MindAR 锚点局部坐标：图片躺在 XY 平面，+Z 指向纸面外（法线方向），1 单位 = 图宽。
   * 直接把视频平面留在 XY 平面 = 人物平躺在纸上（原来的效果）。
   * 这里每帧重建平面的局部矩阵：
   *   up    = 锚点 +Z（纸面法线）→ 人物沿纸面法线方向立起来
   *   right = up × (指向相机的方向) 投影到纸面 → 人物正面始终朝向镜头
   *   底边锚定在 z=0，人物脚踩纸面，纸放平后人物垂直站立。
   * 每帧重算而非一次性设 rotation，保证把纸转任意角度、手机绕着走都不会看到侧面薄片。
   */
  if (window.AFRAME && !AFRAME.components['stand-figure']) {
    AFRAME.registerComponent('stand-figure', {
      schema: {
        height: { type: 'number', default: 1 },
        scale: { type: 'number', default: 1 },
        // 相机仰角超过 tiltStart 后开始后倾，最多后倾 tiltMax 度。
        // 45° 以内严格垂直站立；正上方俯视时靠后倾保证仍能看见人物。
        tiltStart: { type: 'number', default: 45 },
        tiltMax: { type: 'number', default: 45 },
        // 朝向平滑：相机位姿噪声会直接变成人物转向抖动，
        // 且人物越高、头顶被放得越大，所以这里对 yaw/tilt 单独做死区+阻尼。
        yawRate: { type: 'number', default: 6 },
        tiltRate: { type: 'number', default: 4 },
        yawDeadzone: { type: 'number', default: 1.5 },   // 度
        tiltDeadzone: { type: 'number', default: 1.0 }   // 度
      },

      init: function () {
        this._m = new AFRAME.THREE.Matrix4();
        this._camLocal = new AFRAME.THREE.Vector3();
        this._up = new AFRAME.THREE.Vector3(0, 0, 1);
        this._right = new AFRAME.THREE.Vector3();
        this._fwd = new AFRAME.THREE.Vector3();
        this._pos = new AFRAME.THREE.Vector3();
        this._scale = new AFRAME.THREE.Vector3();
        this._quat = new AFRAME.THREE.Quaternion();
        this._basis = new AFRAME.THREE.Matrix4();
        this._inv = new AFRAME.THREE.Matrix4();
        this._yaw = null;        // 平滑后的朝向角（弧度）
        this._tilt = 0;          // 平滑后的后倾角（弧度）
        this._prevTime = null;
        // 自己接管矩阵，避免 A-Frame 用 position/rotation 覆盖
        this.el.object3D.matrixAutoUpdate = false;
      },

      tick: function (time) {
        var obj = this.el.object3D;
        var anchor = this.el.parentNode && this.el.parentNode.object3D;
        var sceneEl = this.el.sceneEl;
        if (!anchor || !sceneEl || !sceneEl.camera) return;

        // 锚点不可见（未识别到图）时不必计算
        if (!anchor.visible) return;

        anchor.updateWorldMatrix(true, false);
        this._inv.copy(anchor.matrixWorld).invert();

        // 相机位置换算到锚点局部坐标
        var camObj = sceneEl.camera;
        camObj.updateWorldMatrix(true, false);
        this._camLocal.setFromMatrixPosition(camObj.matrixWorld).applyMatrix4(this._inv);

        var dt = this._prevTime == null ? 0.016 : (time - this._prevTime) / 1000;
        this._prevTime = time;
        if (!(dt > 0) || dt > 0.1) dt = 0.016;

        // 人物站在纸面中心，脚底 z=0；朝向取相机在纸面上的投影方向
        var dx = this._camLocal.x;
        var dy = this._camLocal.y;
        var len = Math.sqrt(dx * dx + dy * dy);

        // 目标朝向角与后倾角
        var yawTarget = (len < 1e-6) ? (this._yaw == null ? Math.atan2(-1, 0) : this._yaw)
                                     : Math.atan2(dy, dx);
        var elev = Math.atan2(this._camLocal.z, len);
        var tiltTarget = Math.max(0, elev - this.data.tiltStart * Math.PI / 180);
        tiltTarget = Math.min(tiltTarget, this.data.tiltMax * Math.PI / 180);

        var D2R = Math.PI / 180;
        if (this._yaw == null) {
          this._yaw = yawTarget;
          this._tilt = tiltTarget;
        } else {
          // yaw 差值归一到 [-PI, PI]，避免跨 ±180° 时绕远路
          var dYaw = yawTarget - this._yaw;
          while (dYaw > Math.PI) dYaw -= 2 * Math.PI;
          while (dYaw < -Math.PI) dYaw += 2 * Math.PI;
          // 大角度偏差（绕到人物背面）要快速转身，否则平滑惯性会让人物
          // 长时间背对镜头；小偏差才用强平滑压噪声。
          var yawBig = Math.abs(dYaw) > 25 * D2R;
          var yawRate = yawBig ? 14 : this.data.yawRate;
          if (yawBig || Math.abs(dYaw) > this.data.yawDeadzone * D2R) {
            this._yaw += dYaw * (1 - Math.exp(-yawRate * dt));
          }
          var dTilt = tiltTarget - this._tilt;
          var tiltBig = Math.abs(dTilt) > 15 * D2R;
          var tiltRate = tiltBig ? 12 : this.data.tiltRate;
          if (tiltBig || Math.abs(dTilt) > this.data.tiltDeadzone * D2R) {
            this._tilt += dTilt * (1 - Math.exp(-tiltRate * dt));
          }
        }

        var hx = Math.cos(this._yaw), hy = Math.sin(this._yaw);
        var ct = Math.cos(this._tilt), st = Math.sin(this._tilt);

        // right 与"纸面内指向相机"垂直；up 由 +Z 向背离相机的水平方向倾斜 tilt
        this._right.set(-hy, hx, 0);
        this._up.set(-st * hx, -st * hy, ct);
        this._fwd.crossVectors(this._right, this._up).normalize();

        this._basis.makeBasis(this._right, this._up, this._fwd);
        this._quat.setFromRotationMatrix(this._basis);
        // 底边贴纸：平面几何以中心为原点，故沿 up 抬升半个（缩放后的）高度，
        // 这样调节大小时脚底始终踩在纸面上，不会浮空或陷入
        var s = this.data.scale;
        var h = this.data.height * s;
        // 沿倾斜后的 up 抬升半个高度，底边中点始终落在纸面原点（脚踩纸）
        this._pos.copy(this._up).multiplyScalar(h / 2);
        this._scale.set(s, s, s);
        this._m.compose(this._pos, this._quat, this._scale);
        obj.matrix.copy(this._m);
        obj.matrixWorldNeedsUpdate = true;
      }
    });
  }

  /* ============ 位姿阻尼 + 位置保持 ============
   * 两个问题一起解决：
   * 1) 抖动：图像追踪的位姿本身有噪声。人物垂直站立后，底边的微小抖动
   *    会沿身高被放大（力臂效应），头顶晃得尤其明显。这里把矩阵分解成
   *    位置/旋转/缩放，位置做指数阻尼、旋转做球面插值，逐帧逼近目标，
   *    既压掉高频噪声又保留真实移动。
   * 2) 保持：MindAR 丢失目标会把矩阵置零并 visible=false，人物随之消失。
   *    这里沿用最后一次平滑后的位姿，让人物留在原处；重新识别则跟回纸面。
   */
  if (window.AFRAME && !AFRAME.components['anchor-persist']) {
    AFRAME.registerComponent('anchor-persist', {
      schema: {
        enabled: { type: 'boolean', default: true },
        // 每秒收敛速率（指数低通）。越小越稳、越大越跟手。
        // 3.5 约 285ms 时间常数：对"人物站在纸上、人缓慢移动手机"这种
        // 低频运动完全跟得上，同时把追踪高频噪声压到很低。
        posRate: { type: 'number', default: 5 },
        // 旋转噪声会经身高放大成头顶摇摆，比位置噪声更显眼，阻尼更强。
        rotRate: { type: 'number', default: 2.5 },
        // 保留参数以兼容旧调用，但默认关闭硬死区（见 tick 内说明）
        deadzone: { type: 'number', default: 0 },
        rotDeadzone: { type: 'number', default: 0 },
        // 人物身高（锚点单位），用于按身高归一化旋转阻尼
        figureHeight: { type: 'number', default: 1 }
      },

      init: function () {
        var T = AFRAME.THREE;
        this._last = new T.Matrix4();
        this._target = new T.Matrix4();
        this._has = false;
        this._persisting = false;
        this._smoothPos = new T.Vector3();
        this._smoothQuat = new T.Quaternion();
        this._smoothScale = new T.Vector3(1, 1, 1);
        this._tPos = new T.Vector3();
        this._tQuat = new T.Quaternion();
        this._tScale = new T.Vector3();
        // 上次"采纳"的目标位姿，死区以它为基准
        this._anchorPos = new T.Vector3();
        this._anchorQuat = new T.Quaternion();
        this._prevTime = null;
        this._reacquire = false;
        var self = this;
        this.el.addEventListener('targetFound', function () {
          self._persisting = false;
          // 重新识别：纸可能已被移到别处，若沿用旧平滑值会因偏差过大
          // 而长时间跟不上（甚至看起来卡住）。这里标记需要重新对齐。
          self._reacquire = true;
        });
      },

      tick: function (time) {
        if (!this.data.enabled) return;
        var obj = this.el.object3D;
        var T = AFRAME.THREE;

        // 帧间隔（秒），钳制避免切后台回来时大步长跳变
        var dt = this._prevTime == null ? 0.016 : (time - this._prevTime) / 1000;
        this._prevTime = time;
        if (!(dt > 0) || dt > 0.1) dt = 0.016;

        if (obj.visible) {
          obj.updateWorldMatrix(true, false);
          this._target.copy(obj.matrixWorld);
          this._target.decompose(this._tPos, this._tQuat, this._tScale);

          // 重新识别且偏差很大时直接对齐，避免长时间追赶看起来像卡住
          if (this._reacquire) {
            this._reacquire = false;
            this._prevTime = null;
            if (this._smoothPos.distanceTo(this._tPos) > 0.15) {
              this._smoothPos.copy(this._tPos);
              this._smoothQuat.copy(this._tQuat);
              this._smoothScale.copy(this._tScale);
              this._anchorPos.copy(this._tPos);
              this._anchorQuat.copy(this._tQuat);
              this._last.compose(this._smoothPos, this._smoothQuat, this._smoothScale);
              obj.matrix.copy(this._last);
              obj.matrixWorld.copy(this._last);
              obj.matrixWorldNeedsUpdate = false;
              return;
            }
          }

          if (!this._has) {
            // 首次锁定：直接对齐，避免从原点飞入
            this._smoothPos.copy(this._tPos);
            this._smoothQuat.copy(this._tQuat);
            this._smoothScale.copy(this._tScale);
            this._anchorPos.copy(this._tPos);
            this._anchorQuat.copy(this._tQuat);
            this._has = true;
          } else {
            // 纯低通（指数阻尼），不用硬死区。
            // 硬死区会让采纳值阶梯式跳变，阻尼跟不上反而产生台阶抖动
            // （实测残余反而变大）。连续低通对高频噪声衰减更干净。
            var ap = 1 - Math.exp(-this.data.posRate * dt);
            this._smoothPos.lerp(this._tPos, ap);
            // 旋转噪声在头顶的位移 ≈ 身高 × 角度，所以人物越高就要越强地
            // 抑制旋转。按身高归一化，使不同比例的动作观感一致。
            // 超线性：身高越长，杠杆放大越强，需要比线性更快地收紧阻尼
            var hNorm = Math.pow(Math.max(0.5, this.data.figureHeight || 1), 1.6);
            var ar = 1 - Math.exp(-(this.data.rotRate / hNorm) * dt);
            this._smoothQuat.slerp(this._tQuat, ar);
            this._smoothScale.copy(this._tScale);
          }

          this._last.compose(this._smoothPos, this._smoothQuat, this._smoothScale);
          obj.matrix.copy(this._last);
          obj.matrixWorld.copy(this._last);
          obj.matrixWorldNeedsUpdate = false;
          return;
        }

        if (!this._has) return;
        // 丢失追踪：沿用最后平滑位姿，人物留在原处
        obj.visible = true;
        obj.matrix.copy(this._last);
        obj.matrixWorld.copy(this._last);
        obj.matrixWorldNeedsUpdate = false;
        this._persisting = true;
      },

      isPersisting: function () { return this._persisting; }
    });
  }

  /* ============ AR 模式：MindAR 图像追踪 ============ */
  function startAR() {
    var scene = document.createElement('a-scene');
    scene.setAttribute('mindar-image',
      'imageTargetSrc: ' + action.target + ';' +
      'autoStart: true; uiLoading: no; uiScanning: no; uiError: no;' +
      // 抖动抑制：MindAR 默认 filterBeta=1000 极大，One Euro 滤波器里
      // cutOff = minCutOff + beta*|速度|，beta 这么高等于对噪声几乎不滤波。
      // 降到 0.02 让静止时强平滑、移动时仍能跟上；
      // missTolerance 提高可避免瞬时丢帧造成的位置跳变。
      'maxTrack: 1; missTolerance: 8; warmupTolerance: 4;' +
      'filterMinCF: 0.0008; filterBeta: 0.02');
    scene.setAttribute('color-space', 'sRGB');
    scene.setAttribute('renderer', 'antialias: true; colorManagement: true; physicallyCorrectLights: true');
    scene.setAttribute('embedded', '');
    scene.setAttribute('vr-mode-ui', 'enabled: false');
    scene.setAttribute('device-orientation-permission-ui', 'enabled: false');
    scene.setAttribute('loading-screen', 'enabled: false');
    scene.style.cssText = 'position:fixed;inset:0;width:100%;height:100%';

    var assets = document.createElement('a-assets');
    var vid = document.createElement('video');
    vid.id = 'ar-vid';
    vid.src = action.video.replace('.mp4', '-alpha.mp4');
    vid.setAttribute('loop', '');
    vid.setAttribute('playsinline', '');
    vid.setAttribute('webkit-playsinline', '');
    vid.setAttribute('preload', 'auto');
    vid.muted = true;
    assets.appendChild(vid);
    scene.appendChild(assets);

    var cam = document.createElement('a-camera');
    cam.setAttribute('position', '0 0 0');
    cam.setAttribute('look-controls', 'enabled: false');
    cam.setAttribute('wasd-controls', 'enabled: false');
    scene.appendChild(cam);

    var target = document.createElement('a-entity');
    target.setAttribute('mindar-image-target', 'targetIndex: 0');
    // 丢失追踪后保持人物留在原处（纸可以放下）；
    // figureHeight 用于按身高归一化旋转阻尼（高个人物头顶放大更明显）
    target.setAttribute('anchor-persist', 'figureHeight: ' + action.planeHeight.toFixed(4));

    // 1 单位 = 追踪图宽度，原点在图片中心。
    // 锚点局部坐标里图片躺在 XY 平面、+Z 指向纸面外，
    // 所以让人物"站起来"= 把平面的高度方向对齐到 +Z，底边落在纸面 z=0 上。
    // stand-figure 每帧重建朝向矩阵，使人物垂直站立且正面朝向镜头。
    var plane = document.createElement('a-video');
    plane.setAttribute('src', '#ar-vid');
    plane.setAttribute('material', 'shader: white-key; src: #ar-vid; transparent: true; depthWrite: false; side: double');
    plane.setAttribute('width', '1');
    plane.setAttribute('height', String(action.planeHeight.toFixed(4)));
    plane.setAttribute('stand-figure', 'height: ' + action.planeHeight.toFixed(4));
    target.appendChild(plane);
    scene.appendChild(target);

    $('aframe-root').appendChild(scene);

    var found = false;
    var lostCount = 0;
    var arStarted = false;   // MindAR 是否已成功启动摄像头（arReady）

    scene.addEventListener('arReady', function () { arStarted = true; });

    target.addEventListener('targetFound', function () {
      found = true;
      lostCount = 0;
      vid.play().catch(function () {});
      tip('已锁定：可以把纸放平，人物会立在纸上', 4000);
    });

    target.addEventListener('targetLost', function () {
      // 不暂停：人物保持在最后识别到的位置继续动作，纸可以放下或移出画面
      vid.play().catch(function () {});
      lostCount++;
      tip('人物已留在原处，可放下纸自由观看', 3200);
      if (lostCount >= 3) {
        tip('想让人物重新跟随纸面，把镜头再对准图即可', 5200);
        lostCount = 0;
      }
    });

    scene.addEventListener('loaded', function () {
      showHud();
      tip('缓慢移动镜头，对准下方参考图（' + action.name + '）', 6000);
    });

    scene.addEventListener('arError', function () {
      // MindAR 启动摄像头失败（微信内常见）。
      // 不要调 sys.stop()：摄像头未起来时其内部状态未初始化，会抛
      // "Cannot read properties of undefined (reading 'stopProcessVideo')"。
      bailToView('摄像头启动失败，已切换展示模式');
    });

    // 微信内 getUserMedia 可能永久挂起：既不 resolve 也不 reject，
    // 此时 MindAR 仍可能派发 arReady（场景已加载），所以不能只看事件。
    // 唯一可靠的判据是"摄像头视频是否真的出画面"：检查 MindAR 内部 video 元素。
    function cameraActuallyRunning() {
      try {
        var sys = scene.systems && scene.systems['mindar-image-system'];
        var v = sys && sys.video;
        if (v && v.readyState >= 2 && v.videoWidth > 0 && !v.paused) return true;
        // 退一步：页面上任何正在播放的摄像头流
        var vids = document.querySelectorAll('video');
        for (var i = 0; i < vids.length; i++) {
          if (vids[i].srcObject && vids[i].readyState >= 2 && vids[i].videoWidth > 0) return true;
        }
      } catch (e) {}
      return false;
    }

    function bailToView(reason) {
      if (mode !== 'ar') return;
      var sys = null;
      try { sys = scene.systems && scene.systems['mindar-image-system']; } catch (e) {}

      // 释放 MindAR 可能持有的摄像头，避免指示灯常亮
      try {
        if (sys && sys.video && sys.video.srcObject) {
          sys.video.srcObject.getTracks().forEach(function (t) { t.stop(); });
          sys.video.srcObject = null;
        }
      } catch (e) {}

      // 关键：直接移除 DOM 会触发 A-Frame 卸载组件 -> MindAR.stop() -> pause()，
      // 而摄像头未启动时其内部 controller 为 undefined，会抛
      // "Cannot read properties of undefined (reading 'stopProcessVideo')"。
      // 先把该组件的 remove 钩子替换为空实现，再移除节点。
      try {
        var comp = scene.components && scene.components['mindar-image'];
        if (comp) comp.remove = function () {};
      } catch (e) {}
      try {
        if (sys && typeof sys.pause === 'function') sys.pause = function () {};
      } catch (e) {}

      var root = $('aframe-root');
      if (root) {
        try { root.innerHTML = ''; } catch (e) { while (root.firstChild) root.removeChild(root.firstChild); }
      }
      mode = 'view';
      startView();
      tip(reason + (ENV.isInAppBrowser ? '。' + ENV.openInBrowserHint() : ''), 10000);
    }

    // 15 秒仍无摄像头画面 -> 判定失败并降级
    setTimeout(function () {
      if (mode !== 'ar') return;
      if (!cameraActuallyRunning()) bailToView('摄像头无响应，已切换展示模式');
    }, 15000);

    // 40 秒未识别则提示兜底
    setTimeout(function () {
      if (!found) tip('没扫出来？手绘线条特征较少，可切换自由展示', 8000);
    }, 40000);

    $('btn-switch').textContent = '切换自由展示';
    $('btn-switch').onclick = function () { location.href = 'ar.html?action=' + key + '&mode=gyro'; };
  }

  /* ============ 陀螺仪兜底：摄像头实景 + 视频悬浮随动 ============ */
  function startGyro() {
    $('gyro-stage').classList.add('on');
    var camEl = $('cam');
    var floatEl = $('float');
    var wrap = $('float-wrap');
    floatEl.src = action.video;
    floatEl.muted = true;

    function playAll() {
      if (floatEl.paused) floatEl.play().catch(function () {});
    }

    function fallbackToView(reason) {
      showHud();
      camEl.style.display = 'none';
      $('gyro-stage').style.background = '#241a1c';
      playAll();
      // 已无摄像头实景，徽标应如实反映为展示模式
      mode = 'view';
      $('name-badge').textContent = action.name + ' · 展示模式';
      $('btn-switch').textContent = '尝试摄像头 AR';
      $('btn-switch').onclick = function () { location.href = 'ar.html?action=' + key + '&mode=ar'; };
      tip(reason || '摄像头不可用，已切换为展示模式', 6000);
    }

    // 微信内置浏览器里 getUserMedia 可能同步抛错或永久挂起，
    // 统一走带超时的探测，任何失败都降级到纯展示，不让页面卡死。
    ENV.probeCamera(8000, {
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
      audio: false
    }).then(function (res) {
      if (res && res.stream) {
        camEl.srcObject = res.stream;
        camEl.play().catch(function () {});
        showHud();
        playAll();
        tip('人物居中展示，可用下方滑杆调整大小', 4200);
      } else {
        fallbackToView(res && res.message);
      }
    }).catch(function () {
      fallbackToView();
    });

    wrap.addEventListener('click', playAll);
    $('btn-switch').textContent = '切换扫图模式';
    $('btn-switch').onclick = function () { location.href = 'ar.html?action=' + key + '&mode=ar'; };
  }

  /* ============ 纯展示模式：完全不用摄像头，微信内可直接观看 ============
   * 微信内置浏览器对 getUserMedia 限制很严（安卓部分支持、iOS 常失败、
   * 且可能永久挂起），所以提供一条不依赖任何摄像头权限的路径，
   * 保证微信扫码进来一定能看到人物动作。
   */
  function startView() {
    $('gyro-stage').classList.add('on');
    var camEl = $('cam');
    var floatEl = $('float');
    var wrap = $('float-wrap');
    camEl.style.display = 'none';
    $('gyro-stage').style.background = 'radial-gradient(circle at 50% 40%, #3a2426 0%, #1a1214 70%)';
    floatEl.src = action.video;
    floatEl.muted = true;
    floatEl.setAttribute('playsinline', '');
    floatEl.setAttribute('webkit-playsinline', '');
    // 微信安卓需用户首次触摸后才能播放；这里已在按钮点击的同一手势链里
    floatEl.play().catch(function () {});
    showHud();
    $('name-badge').textContent = action.name + ' · 展示模式';
    wrap.addEventListener('click', function () { floatEl.play().catch(function () {}); });
    $('btn-switch').textContent = '尝试摄像头 AR';
    $('btn-switch').onclick = function () { location.href = 'ar.html?action=' + key + '&mode=ar'; };
    tip(ENV.isWeChat ? ('展示模式：' + ENV.openInBrowserHint()) : '展示模式，点右上角可尝试摄像头 AR', 9000);
  }

  /* iOS / 微信需用户手势后才能启动摄像头与播放视频 */
  var starting = false;
  $('ov-start').addEventListener('click', function () {
    if (starting) return;
    starting = true;
    if (mode === 'view') { startView(); return; }
    if (mode === 'gyro') { startGyro(); return; }

    // 扫图模式：不做预探测。
    // 预探测会先占用摄像头再释放，随后 MindAR 再开一路，两者可能争抢设备
    // 导致启动失败（实测偶发）。这里只判断"环境是否可能支持"，
    // 真正的启动交给 MindAR，失败由 arError 与超时兜底降级。
    if (!ENV.isSecure || !ENV.hasMediaDevices) {
      mode = 'view';
      startView();
      var why = !ENV.isSecure ? '非 HTTPS 环境无法调用摄像头' : '当前浏览器不支持网页摄像头';
      tip(why + '，已切换展示模式。' + (ENV.isInAppBrowser ? ENV.openInBrowserHint() : ''), 10000);
      return;
    }
    $('ov-start').textContent = '正在启动…';
    startAR();
  });

  /* 微信内进入时给出明确提示与一键展示入口 */
  (function initWeChatNotice() {
    if (!ENV.isInAppBrowser) return;
    var note = document.createElement('p');
    note.id = 'wx-note';
    note.style.cssText = 'font-size:13px;line-height:1.7;opacity:.9;max-width:30em;margin:0';
    note.textContent = '微信内可能无法调用摄像头。可先看展示模式，或' + ENV.openInBrowserHint() + '。';
    var overlay = $('start-overlay');
    overlay.insertBefore(note, $('ov-start'));

    var viewBtn = document.createElement('button');
    viewBtn.className = 'btn ghost';
    viewBtn.id = 'ov-view';
    viewBtn.textContent = '直接看展示（不用摄像头）';
    overlay.appendChild(viewBtn);
    viewBtn.addEventListener('click', function () {
      if (starting) return;
      starting = true;
      mode = 'view';
      startView();
    });
    // 微信内默认按钮改为先试摄像头，文案更明确
    $('ov-start').textContent = '尝试开启摄像头 AR';
  })();
})();
</script>
</body>
</html>
